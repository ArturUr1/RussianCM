- type: entity
  parent: RMCIntelTechTree
  id: CMUIntelTechTree_CLF
  name: разведовательное древо технологий (КОФ)
  categories: [ HideSpawnMenu ]
  components:
  - type: IntelTechTree
    tree:
      options:
# ├──[ Tier 0 ]──────────────────────────────────────────────────────┤
      -
        - name: Разблокировать Уровень 1
          description: Переходит к следующему уровню изучений.
          cost: 0
          events:
          - !type:TechUnlockTierEvent
            tier: 1
          icon:
            sprite: _RMC14/Interface/tech_tree.rsi
            state: upgrade
# ├──[ Tier 1: Cell support & reinforcements ]───────────────────────┤
      -
        - name: Увеличение бюджета на закупки
          description: Распределяет ресурсы для расходов на закупки.
          cost: 6
          increase: 2
          repurchasable: true
          events:
          - !type:TechRequisitionsBudgetEvent
            amount: 5000
          icon:
            sprite: _RMC14/Interface/tech_tree.rsi
            state: budget_req
        - name: Подкрепление из числа повстанцев
          description: Призывает подкрепление из соседней клетки.
          cost: 25
          increase: 6
          repurchasable: true
          events:
          - !type:TechPartySpawnEvent
            thirdPartyId: CLFCellReinforcementsIntel
          icon:
            sprite: _RMC14/Interface/tech_tree.rsi
            state: beacon
        - name: Подкрепление пулеметчиков
          description: Призывает пулеметчика из соседней клетки.
          cost: 8
          repurchasable: false
          events:
          - !type:TechPartySpawnEvent
            thirdPartyId: CLFCellReinforcementsIntelMachineGunner
          icon:
            sprite: _RMC14/Interface/tech_tree.rsi
            state: beacon
        - name: Запросить рейд VAISO на Вейланд-Ютани
          description: Отправить разведданные о Вейланд-Ютани, чтобы вызвать команду VAISO для осуществления рейда. Они не враждуют с КОФ, но не обязаны помогать напрямую!
          cost: 50
          repurchasable: false
          events:
          - !type:TechPartySpawnEvent
            thirdPartyId: VAISO
          icon:
            sprite: _RMC14/Interface/tech_tree.rsi
            state: beacon
        - name: Запросить Команндоров КОФ
          description: Отправляет разведданные высшему командованию КОФ, вызывая отряд спецназа КОФ на помощь ячейке
          cost: 50
          repurchasable: false
          events:
          - !type:TechPartySpawnEvent
            thirdPartyId: CLFCommandoSpawnIntel
          icon:
            sprite: _RMC14/Interface/tech_tree.rsi
            state: beacon
        - name: Запрос вооружённой ремонтной бригады "Янки" от Продиджи
          description: Призовите команду ЧВК из Продиджи, в частности отряд «Янки». Они не враждуют с CLF, но их помощь не требуется.
          cost: 45
          repurchasable: false
          events:
          - !type:TechPartySpawnEvent
            thirdPartyId: ProdigyPARTY
          - !type:TechAnnounceEvent
            author: РАЗВЕДОВАТЕЛЬНОЕ УПРАВЛЕНИЕ
            message: Бригада "Янки" от Продиджи была направлена для оказания помощи в операции.
          icon:
            sprite: _RMC14/Interface/tech_tree.rsi
            state: beacon
