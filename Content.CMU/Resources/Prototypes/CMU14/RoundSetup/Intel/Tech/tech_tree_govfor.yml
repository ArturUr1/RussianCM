- type: entity
  parent: RMCIntelTechTree
  id: CMUIntelTechTree_GOVFOR
  name: разведовательное древо технологий (ГОВФОР)
  categories: [ HideSpawnMenu ]
  components:
  - type: IntelTechTree
    tree:
      options:
# ├──[ Tier 0 ]──────────────────────────────────────────────────────┤
      -
        - name: Открыть Уровень 1
          description: Позволяет перейти к следующему уровню дерева технологий.
          cost: 0
          events:
          - !type:TechUnlockTierEvent
            tier: 1
          icon:
            sprite: _RMC14/Interface/tech_tree.rsi
            state: upgrade
# ├──[ Tier 1: Early resupply & budget ]─────────────────────────────┤
      -
        - name: Увеличить Бюджет Запасов
          description: Распределяет ресурсы для расходов на запасы.
          cost: 12
          increase: 3
          repurchasable: true
          events:
          - !type:TechRequisitionsBudgetEvent
            amount: 5000
          - !type:TechAnnounceEvent
            author: ОДОБРЕНО ИСПОЛЬЗОВАНИЕ СПЕЦИАЛЬНЫХ СРЕДСТВ
            message: Для этой операции выделен дополнительный бюджет на поставку.
          icon:
            sprite: _RMC14/Interface/tech_tree.rsi
            state: budget_req
        - name: Расследовательная Группа БКМ
          description: Призывает расследовательную группу БКМ в область.
          cost: 10
          events:
          - !type:TechPartySpawnEvent
            thirdPartyId: CMBInvestigationPartyAlt
          - !type:TechAnnounceEvent
            author: РАЗЕДОВАТЕЛЬНОЕ УПРАВЛЕНИЕ
            message: Следственная группа БКМ была направлена для изучения разведданных.
          icon:
            sprite: _RMC14/Interface/tech_tree.rsi
            state: beacon
        - name: Поисково-Спасательная К9 Команда
          description: Вызовите специалиста по поисково-спасательным работам и его четвероногого напарника.
          cost: 6
          events:
          - !type:TechPartySpawnEvent
            thirdPartyId: AU14IntelThirdPartyK9
          - !type:TechAnnounceEvent
            author: РАЗВЕДОВАТЕЛЬНОЕ УПРАВЛЕНИЕ
            message: Специалист по поисково-спасательным работам и его четвероногий напарник были направлены для помощи в операции.
          icon:
            sprite: _RMC14/Interface/tech_tree.rsi
            state: medic_qol
        - name: Группа помощи Красного Креста
          description: Вызовите группу помощи Красного Креста. Нейтральные медики для всех.
          cost: 15
          events:
          - !type:TechPartySpawnEvent
            thirdPartyId: ICRCReliefParty
          - !type:TechAnnounceEvent
            author: РАЗВЕДОВАТЕЛЬНОЕ УПРАВЛЕНИЕ
            message: Группа Красного Креста была направлена для оказания помощи в операции.
          icon:
            sprite: _RMC14/Interface/tech_tree.rsi
            state: beacon
        - name: Разблокировать Уровень 2
          description: Позволяет перейти к следующему уровню дерева технологий.
          cost: 3
          events:
          - !type:TechUnlockTierEvent
            tier: 2
          - !type:TechAnnounceEvent
            author: ВЫСШЕЕ КОМАНДОВАНИЕ ГОВФОР
            message: "УВЕДОМЛЕНИЕ: с настоящего момента готовность установлена на УРОВНЕ 2. Разрешение на эскалацию получено. Ресурсы второго эшелона готовы к развертыванию по усмотрению командира.

              По приказу Высшего Командования ГОВФОР."
            sound: /Audio/_RMC14/AI/commandreport.ogg
          icon:
            sprite: _RMC14/Interface/tech_tree.rsi
            state: upgrade
# ├──[ Tier 2: Support & specialists ]───────────────────────────────┤
      -
        - name: Патрульный Транспорт БКМ
          description: Вызовите шаттл БКМ, чтобы вывезти захваченных в плен бойцов с планеты. Сочетается с целями по аресту.
          cost: 8
          events:
          - !type:TechPartySpawnEvent
            thirdPartyId: CMBParoleeTransport
          - !type:TechAnnounceEvent
            author: РАЗВЕДОВАТЕЛЬНОЕ УПРАВЛЕНИЕ
            message: Для оформления задержанных направлен патрульный шаттл БКМ для перевозки условно-досрочно освобожденных.
          icon:
            sprite: _RMC14/Interface/tech_tree.rsi
            state: beacon
        - name: Бюджет Фабрикатора Дропшипа
          description: Распределение ресурсов для расходов на производство деталей дропшипа.
          cost: 12
          increase: 2
          repurchasable: true
          events:
          - !type:TechDropshipBudgetEvent
            amount: 2000
          - !type:TechAnnounceEvent
            author: ОДОБРЕНО ИСПОЛЬЗОВАНИЕ СПЕЦИАЛЬНЫХ СРЕДСТВ
            message: Дополнительные очки фабрикатора деталей дропшипа были утверждены для этой операции.
          icon:
            sprite: _RMC14/Interface/tech_tree.rsi
            state: budget_ds
        - name: Снайперская Команда ЛАКН
          description: Вызовите снайперскую команду ЛАКН для обеспечения наблюдения.
          cost: 20
          events:
          - !type:TechPartySpawnEvent
            thirdPartyId: LACNSniperteamIntel
          - !type:TechAnnounceEvent
            author: РАЗВЕДОВАТЕЛЬНОЕ УПРАВЛЕНИЕ
            message: Команда снайперов ЛАКН была направлена для обеспечения наблюдения.
          icon:
            sprite: _RMC14/Interface/tech_tree.rsi
            state: beacon
        - name: Разблокировать Уровень 3
          description: Позволяет перейти к следующему уровню дерева технологий.
          cost: 5
          events:
          - !type:TechUnlockTierEvent
            tier: 3
          - !type:TechAnnounceEvent
            author: ВЫСШЕЕ КОМАНДОВАНИЕ ГОВФОР
            message: "ОБЩИЙ ПРИКАЗ: С настоящего момента уровень боевой готовности — 3. Командование театра военных действий расценивает враждебные действия как прямую угрозу району боевых действий. Выделены дополнительные силы. Все подразделения должны сохранять дисциплину и удерживать занимаемые позиции.

              По приказу Командования Театра Военных Действий."
            sound: /Audio/_RMC14/AI/commandreport.ogg
          icon:
            sprite: _RMC14/Interface/tech_tree.rsi
            state: upgrade
# ├──[ Tier 3: Force multipliers ]───────────────────────────────────┤
      -
        - name: Пехотный взвод армии ОА
          description: Вызовите пехотный взвод армии ОА для усиления операции.
          cost: 25
          events:
          - !type:TechPartySpawnEvent
            thirdPartyId: CMUUSArmyReinforcements
          - !type:TechAnnounceEvent
            author: РАЗВЕДОВАТЕЛЬНОЕ УПРАВЛЕНИЕ
            message: Пехотный взвод армии ОА был направлен для усиления операции.
          icon:
            sprite: _RMC14/Interface/tech_tree.rsi
            state: marine
        - name: Группа Ликвидации ФОРЕКОН
          description: Призовите группа ликвидации ФОРЕКОН для устранения высокоприоритетных целей.
          cost: 30
          events:
          - !type:TechPartySpawnEvent
            thirdPartyId: FORECONKillTeam
          - !type:TechAnnounceEvent
            author: РАЗВЕДОВАТЕЛЬНОЕ УПРАВЛЕНИЕ
            message: Группа ликвидации ФОРЕКОН была направлена для устранения высокоприоритетных целей.
          icon:
            sprite: _RMC14/Interface/tech_tree.rsi
            state: weapon
        - name: Разблокировать Уровень 4
          description: Позволяет перейти к следующему уровню дерева технологий.
          cost: 5
          events:
          - !type:TechUnlockTierEvent
            tier: 4
          - !type:TechAnnounceEvent
            author: ВЫСШЕЕ КОМАНДОВАНИЕ ГОВФОР
            message: "ПРИОРИТЕТНОЕ УВЕДОМЛЕНИЕ: УРОВЕНЬ ГОТОВНОСТИ 4. Командование театра военных действий объявило о критической ситуации в зоне боевых действий. Все оставшиеся силы приведены в боевую готовность. Допускается свободное использование любого оружия. Эвакуация может быть авторизована по усмотрению командира операции.

              По приказу Командования Театра Военных Действий. В добрый путь."
            sound: /Audio/_RMC14/AI/commandreport.ogg
          icon:
            sprite: _RMC14/Interface/tech_tree.rsi
            state: upgrade
# ├──[ Tier 4: Capstones ]───────────────────────────────────────────┤
      -
        - name: Вооружённая ремонтная бригада "Сьерра" ПРОДИДЖИ
          description: Вызовите отряд "Сьерра" в эту область.
          cost: 45
          events:
          - !type:TechPartySpawnEvent
            thirdPartyId: ProdigyPARTSParty
          - !type:TechAnnounceEvent
            author: РАЗВЕДОВАТЕЛЬНОЕ УПРАВЛЕНИЕ
            message: Вооружённая ремонтная бригада "Сьерра" ПРОДИДЖИ была направлена для помощи в операции.
          icon:
            sprite: _RMC14/Interface/tech_tree.rsi
            state: beacon
        - name: 32-я бронетанковая дивизия армии ОА
          description: Призывает 32-ю бронетанковую дивизию армии ОА для усиления операции.
          cost: 55
          events:
          - !type:TechPartySpawnEvent
            thirdPartyId: USArmyArmored
          - !type:TechAnnounceEvent
            author: РАЗВЕДОВАТЕЛЬНОЕ УПРАВЛЕНИЕ
            message: 32-я бронетанковая дивизия армии ОА была направлена для усиления операции.
          icon:
            sprite: _RMC14/Interface/tech_tree.rsi
            state: beacon
        - name: AEG-538-KRA "КРАКЕН"
          description: Экспериментальная форонная боеголовка AEGIS, доставленная в отдел снабжения через автоматизированную систему хранения и поиска. Можно приобрести только через 116 минут после начала операции.
          cost: 30
          timeLock: 115m
          events:
          - !type:TechLogisticsDeliveryEvent
            object: CMUOrbitalCannonWarheadAegis
          - !type:TechAnnounceEvent
            author: ДИВИЗЯ AEGIS R&D
            message: AEG-538-KRA получил разрешение на внедрение и будет передан в отдел снабжения через автоматизированную систему хранения и поиска. Обращайтесь с ним крайне осторожно.
          icon:
            sprite: _RMC14/Interface/tech_tree.rsi
            state: nuke
