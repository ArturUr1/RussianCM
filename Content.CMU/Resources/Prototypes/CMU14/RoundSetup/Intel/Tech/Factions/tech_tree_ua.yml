- type: entity
  parent: RMCIntelTechTree
  id: CMUIntelTechTree_UA # faction specific (USCM)
  name: разведовательное древо технологий (UA)
  categories: [ HideSpawnMenu ]
  components:
  - type: IntelTechTree
    tree:
      options:
# ├──[ Tier 0 ]──────────────────────────────────────────────────────┤
      -
        - name: Разблокировать Уровень 1
          description: Переходит к следующему уровню изучений.
          cost: 0
          events:
          - !type:TechUnlockTierEvent
            tier: 1
          icon:
            sprite: _RMC14/Interface/tech_tree.rsi
            state: upgrade
# ├──[ Tier 1: Budget ]──────────────────────────────────────────────┤
      -
        - name: Увеличить Бюджет Запасов
          description: Распределяет ресурсы для расходов на запасы.
          cost: 12
          increase: 3
          repurchasable: true
          events:
          - !type:TechRequisitionsBudgetEvent
            amount: 5000
          - !type:TechAnnounceEvent
            author: СПЕЦИАЛЬНЫЕ РЕСУРСЫ УТВЕРЖДЕНЫ
            message: Дополнительный бюджет на поставку был утверждён для этой операции.
          icon:
            sprite: _RMC14/Interface/tech_tree.rsi
            state: budget_req
        - name: Разблокировать Уровень 2
          description: Переходит к следующему уровню изучений.
          cost: 3
          events:
          - !type:TechUnlockTierEvent
            tier: 2
          icon:
            sprite: _RMC14/Interface/tech_tree.rsi
            state: upgrade
# ├──[ Tier 2: Reinforcements ]──────────────────────────────────────┤
      -
        - name: 32-я бронетанковая дивизия армии ОА
          description: Призывает отряд 32-й бронетанковой дивизии армии ОА для оказания помощи в операции.
          cost: 55
          repurchasable: false
          events:
          - !type:TechPartySpawnEvent
            thirdPartyId: USArmyArmored
          - !type:TechAnnounceEvent
            author: РАЗВЕДОВАТЕЛЬНОЕ УПРАВЛЕНИЕ
            message: 32-я бронетанковая дивизия армии ОА была направлена для усиления операции.
          icon:
            sprite: _RMC14/Interface/tech_tree.rsi
            state: beacon

        - name: Вооружённая ремонтная команда Продиджи "Янки"
          description: Призывает ЧВК от Продиджи, конкретно отряд "Янки"
          cost: 45
          repurchasable: false
          events:
          - !type:TechPartySpawnEvent
            thirdPartyId: ProdigyPARTY
          - !type:TechAnnounceEvent
            author: РАЗВЕДОВАТЕЛЬНОЕ УПРАВЛЕНИЕ
            message: Вооружённая ремонтная команда Продиджи "Янки" была направлена для усиления операции.
          icon:
            sprite: _RMC14/Interface/tech_tree.rsi
            state: beacon
