- type: entity
  parent: RMCIntelTechTree
  id: CMUIntelTechTree_OPFOR # TODO
  name: intel tech tree (OpFor)
  categories: [ HideSpawnMenu ]
  components:
  - type: IntelTechTree
    tree:
      options:
# ├──[ Tier 0 ]──────────────────────────────────────────────────────┤
      -
        - name: Разблокировать Уровень 1
          description: Переходит к следующему уровню изучений.
          cost: 0
          events:
          - !type:TechUnlockTierEvent
            tier: 1
          icon:
            sprite: _RMC14/Interface/tech_tree.rsi
            state: upgrade
# ├──[ Tier 1: Requisition budget ]──────────────────────────────────┤
      -
        - name: Увеличение бюджета на закупки
          description: Распределяет ресурсы по заявкам на расходование.
          cost: 12
          increase: 3
          repurchasable: true
          events:
          - !type:TechRequisitionsBudgetEvent
            amount: 5000
          - !type:TechAnnounceEvent
            author:  СПЕЦИАЛЬНЫЕ РЕСУРСЫ УТВЕРЖДЕНЫ
            message: Дополнительный бюджет на поставку был утверждён для этой операции.
          icon:
            sprite: _RMC14/Interface/tech_tree.rsi
            state: budget_req
