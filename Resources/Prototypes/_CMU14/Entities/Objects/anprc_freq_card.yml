- type: entity
  parent: CMPaperWritten
  id: ANPRCFreqCard
  name: AN/PRC-117G frequency assignment card
  description: A laminated card of signal operating instructions, sized to tape to a forearm. The lamination has seen better days.
  components:
  - type: Item
    size: Small
  - type: ANPRCFreqCard
    faction: govfor
  # fallback text only, the server rewrites this from the round's frequency plan
  - type: Paper
    content: |
      [head=2]ИНСТРУКЦИЯ ПО ОРГАНИЗАЦИИ СВЯЗИ[/head]
      [head=3]ЧАСТОТЫ СЕТЕЙ AN/PRC-117G[/head]

      [bold]Командование GOVFOR[/bold] - 2.592 МГц
      [bold]GOVFOR Alpha[/bold]   - 2.502 MHz
      [bold]GOVFOR Bravo[/bold]   - 1.606 MHz
      [bold]GOVFOR Charlie[/bold] - 1.607 MHz
      [bold]GOVFOR Intel[/bold]   - 1.605 MHz
      [bold]GOVFOR JTAC[/bold]    - 2.598 MHz
      [bold]GOVFOR MILP[/bold]    - 2.595 MHz

      Введите частоту во вкладке «ЧАСТОТА» (с точкой или без неё: 2592 и 2.592 равнозначны), чтобы назначить сеть ячейке.

      [italic]COMSEC: контролируемый документ. Уничтожить при угрозе захвата. Частоты действуют на всём театре; считайте, что противник располагает своей копией.[/italic]

