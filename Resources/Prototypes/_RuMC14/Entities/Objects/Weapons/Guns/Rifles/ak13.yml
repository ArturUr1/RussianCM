- type: entity
  parent: RMCWeaponRifleAK4047
  name: AK-13 assault rifle
  id: RuMCWeaponRifleAK13
  description: A UPP assault rifle, designed to mimic the performance of the American M41A. The 4047 is built with a more utilitarian approach, and can survive use in harsh environments, as long as its user maintains it regularly. Many civilian enthusiasts claim the weapon is nigh invincible, but anyone who has ever served with it will tell you nothing could be further from the truth.
  components:
  - type: Sprite
    sprite: _RuMC14/Objects/Weapons/Guns/Rifles/AK13/AK13_inhands.rsi
    layers:
    - state: base
      sprite: _RuMC14/Objects/Weapons/Guns/Rifles/AK13/AK13.rsi
    - state: bolt-open
      sprite: _RuMC14/Objects/Weapons/Guns/Rifles/AK13/AK13.rsi
      map: [ "enum.GunVisualLayers.Base" ]
    - state: mag-0
      sprite: _RuMC14/Objects/Weapons/Guns/Rifles/AK13/AK13.rsi
      map: [ "enum.GunVisualLayers.Mag" ]
  - type: Clothing
    sprite: _RuMC14/Objects/Weapons/Guns/Rifles/AK13/AK13_inhands.rsi
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: RMCSelectiveFire
    baseFireModes:
    - SemiAuto
    - Burst
    - FullAuto
    recoilUnwielded: 3.5
    scatterWielded: 3.8
    scatterUnwielded: 10
    baseFireRate: 5
    burstScatterMult: 1
  - type: RMCWeaponAccuracy
    accuracyMultiplier: 1.35
    accuracyMultiplierUnwielded: 0.6
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: RMCMagazineRifleAK4047
        insertSound: /Audio/_RMC14/Weapons/Guns/Reload/m41_reload.ogg
        ejectSound: /Audio/_RMC14/Weapons/Guns/Reload/m41_unload.ogg
        priority: 2
        whitelist:
          tags:
          - RMCMagazineRifleAK4047
          - RMCMagazineRifleAK4047AP
          - RMCMagazineRifleAK4047Incendiary
          - RMCMagazineRifleAK4047HEAP
          - RuMCMagazineAK13
  - type: GunDamageModifier
    multiplier: 1.15
  - type: AttachableHolder
    slots:
      rmc-aslot-barrel:
        whitelist:
          tags:
          - RMCAttachmentBarrelCharger
          - RMCAttachmentExtendedBarrel
          - RMCAttachmentExtendedCompensator
          - RMCAttachmentSuppressor
          - RMCM5Bayonet
      rmc-aslot-rail:
        whitelist:
          tags:
          - RMCAttachmentRailFlashlight
          - RMCAttachmentMagneticHarness
          - RMCAttachmentS5RedDotSight
          - RMCAttachmentS6ReflexSight
          - RMCAttachmentS84xTelescopicScope
          - RMCAttachmentS42xTelescopicMiniscope
      rmc-aslot-stock:
        locked: true
        startingAttachable: RuMCAttachmentAK13StockCollapsible
        whitelist:
          tags:
          - RuMCAttachmentAK13StockCollapsible
          - RuMCAttachmentPKPStockCollapsible
      rmc-aslot-underbarrel:
        whitelist:
          tags:
          - RMCAttachmentAngledGrip
          - RMCAttachmentBipod
          - RMCAttachmentFlashlightGrip
          - RMCAttachmentGyroscopicStabilizer
          - RMCAttachmentLaserSight
          - RMCAttachmentU1GrenadeLauncher
          - RMCAttachmentU7UnderbarrelShotgun
          - RMCAttachmentVerticalGrip
          - RMCAttachmentExtinguisher
          - RMCAttachmentFlamer
  - type: AttachableHolderVisuals
    offsets:
      rmc-aslot-barrel: 0.7, 0
      rmc-aslot-rail: -0.3, 0.09
      rmc-aslot-stock: -0.5655, -0.04
      rmc-aslot-underbarrel: 0.25, -0.33
  - type: Tag
    tags:
    - RMCWeaponRifleAK4047
    - RuMCWeaponRifleAK13
  - type: WieldDelay
    baseDelay: 0.22
  - type: GunRequiresWield


