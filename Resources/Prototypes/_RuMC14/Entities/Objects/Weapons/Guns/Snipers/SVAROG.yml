- type: entity
  parent: RMCBaseWeaponSniperRifle
  id: RuMcSniperRifleSVAROG
  name: "'SVAROG' sniper rifle"
  description: #a
  components:
  - type: Item
    size: Huge
  - type: Sprite
    sprite: _RuMC14/Objects/Weapons/Guns/Snipers/SVAROG/inhands.rsi
    layers:
    - state: base
      sprite: _RuMC14/Objects/Weapons/Guns/Snipers/SVAROG/icon.rsi
    - state: bolt-open
      sprite: _RuMC14/Objects/Weapons/Guns/Snipers/SVAROG/icon.rsi
      map: [ "enum.GunVisualLayers.Base" ]
    - state: mag-0
      sprite: _RuMC14/Objects/Weapons/Guns/Snipers/SVAROG/icon.rsi
      map: [ "enum.GunVisualLayers.Mag" ]
  - type: Clothing
    sprite: _RuMC14/Objects/Weapons/Guns/Snipers/SVAROG/inhands.rsi
  - type: Tag
    tags:
    - RuMcSniperRifleSVAROG
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 12
  - type: Gun
    shotsPerBurst: 1
    soundGunshot:
      path: /Audio/_RMC14/Weapons/Guns/Gunshots/gun_sniper.ogg
  - type: RMCSelectiveFire
    recoilWielded: 1
    scatterWielded: 0
    baseFireRate: 0.667
  - type: RMCWeaponAccuracy
    accuracyMultiplier: 3
  - type: WieldDelay
    baseDelay: 1.2
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: RuMcMagazineSniperRifleSVAROG
        insertSound: /Audio/_RMC14/Weapons/Guns/Reload/gun_mar40_reload.ogg
        ejectSound: /Audio/_RMC14/Weapons/Guns/Reload/gun_mar40_unload.ogg
        priority: 2
        whitelist:
          tags:
          - RuMcMagazineSniperRifleSVAROG
  - type: GunRequiresWield
  - type: Corrodible
    isCorrodible: false
  - type: GunIFF
    enabled: false # true
  - type: RMCNameItemOnVend
    item: PrimaryGun
  - type: AttachableHolder
    slots:
      rmc-aslot-rail:
        locked: true
        startingAttachable: RuMCSVAROGIntegratedScope
        whitelist:
          tags:
          - RuMCSVAROGIntegratedScope
      rmc-aslot-underbarrel:
        whitelist:
          tags:
          - RMCAttachmentBipod
  - type: AttachableHolderVisuals
    offsets:
      rmc-aslot-underbarrel: 0.21875, -0.343
  - type: RMCGunChamber
    enabled: false
  - type: InteractedBlacklist
    blacklist:
      components:
      - Xeno
      - CMUPathogenWalker

- type: entity
  parent: BaseItem
  id: RuMcMagazineSniperRifleSVAROG
  name: SVAROG magazine (10x28mm)
  description: #a
  components:
  - type: Tag
    tags:
    - CMMagazineSniper
    - RuMcMagazineSniperRifleSVAROG
  - type: BallisticAmmoProvider
    mayTransfer: True
    whitelist:
      tags:
      - CMCartridgeSniper10x28mm
    proto: CMCartridgeSniper10x28mm
    capacity: 15
  - type: Item
    size: Normal
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Ammunition/Magazines/m42c.rsi
    layers:
    - state: mag-0
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 2
    zeroVisible: false
    zeroOnlyOnEmpty: true
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Appearance
  - type: Clothing
    slots:
    - suitStorage

